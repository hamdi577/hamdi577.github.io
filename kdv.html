<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDV Hesaplayıcı</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
:root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --accent-color: #10b981;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
        }

        .calculator-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: var(--shadow);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="number"], select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .currency {
            position: absolute;
            right: 1rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .radio-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 0.5rem;
        }

        .radio-item {
            position: relative;
            cursor: pointer;
        }

        .radio-item input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .radio-item span {
            display: block;
            padding: 0.5rem;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .radio-item input[type="radio"]:checked + span {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .custom-rate {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding-right: 0.5rem;
        }

        .custom-rate input[type="number"] {
            border: none;
            padding: 0.5rem;
            width: 100%;
            font-size: 0.875rem;
            background: transparent;
        }

        .custom-rate span {
            border: none;
            padding: 0;
        }

        .tevkifat-section {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        #tevkifatStatus {
            font-size: 0.875rem;
            font-weight: 600;
        }

        /* Switch Toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .slider.round {
            border-radius: 24px;
        }

        .slider.round:before {
            border-radius: 50%;
        }

        .results-section {
            border-top: 2px dashed var(--border-color);
            padding-top: 1.5rem;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 0.9375rem;
        }

        .result-item span {
            color: var(--text-muted);
        }

        .result-item strong {
            color: var(--text-main);
        }

        .result-item.highlight {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 1.125rem;
        }

        .result-item.highlight strong {
            color: var(--primary-color);
            font-size: 1.25rem;
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

@media (max-width: 480px) {
            .calculator-card {
                padding: 1.5rem;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-calculator"></i> KDV Hesaplayıcı</h1>
            <p>
                Hızlı, doğru ve detaylı KDV hesaplamaları
            </p>
        </header>

        <main class="calculator-card">
            <div class="input-group">
                <label for="amount">Tutar</label>
                <div class="input-wrapper">
                    <input type="number" id="amount" placeholder="0.00" step="0.01">
                    <span class="currency">₺</span>
                </div>
            </div>

            <div class="input-group">
                <label for="calcType">Hesaplama Türü</label>
                <select id="calcType">
                    <option value="kdvHaric">KDV Hariç Tutar</option>
                    <option value="kdvDahil">KDV Dahil Tutar</option>
                    <option value="kdvTutari">KDV Tutarı</option>
                    <option value="tevkifatTutari">Tevkifat Tutarı</option>
                    <option value="genelToplam">Genel Toplam</option>
                    <option value="kdvdenMatrah">KDV'den Matrah</option>
                </select>
            </div>

            <div class="input-group">
                <label>KDV Oranı</label>
                <div class="radio-group" id="kdvRates">
                    <label class="radio-item">
                        <input type="radio" name="kdvRate" value="0.01">
                        <span>%1</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="kdvRate" value="0.10">
                        <span>%10</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="kdvRate" value="0.20" checked>
                        <span>%20</span>
                    </label>
                    <label class="radio-item custom-rate">
                        <input type="radio" name="kdvRate" value="custom" id="customRateRadio">
                        <input type="number" id="customRateInput" placeholder="Diğer" min="0" max="100">
                        <span>%</span>
                    </label>
                </div>
            </div>

            <div class="tevkifat-section">
                <div class="toggle-group">
                    <label class="switch">
                        <input type="checkbox" id="tevkifatToggle">
                        <span class="slider round"></span>
                    </label>
                    <span id="tevkifatStatus">Tevkifat Yok</span>
                </div>

                <div id="tevkifatOptions" class="hidden">
                    <label for="tevkifatRate">Tevkifat Oranı</label>
                    <select id="tevkifatRate">
                        <option value="0.1">1/10</option>
                        <option value="0.2">2/10</option>
                        <option value="0.3">3/10</option>
                        <option value="0.4">4/10</option>
                        <option value="0.5">5/10</option>
                        <option value="0.6">6/10</option>
                        <option value="0.7">7/10</option>
                        <option value="0.8">8/10</option>
                        <option value="0.9">9/10</option>
                        <option value="1">TAM</option>
                    </select>
                </div>
            </div>

            <div class="results-section">
                <div class="result-item">
                    <span>KDV Hariç Tutar</span>
                    <strong id="resKdvHaric">0,00 ₺</strong>
                </div>
                <div class="result-item">
                    <span>KDV Tutarı</span>
                    <strong id="resKdvTutari">0,00 ₺</strong>
                </div>
                <div class="result-item tevkifat-result hidden">
                    <span>Tevkifat Tutarı</span>
                    <strong id="resTevkifatTutari">0,00 ₺</strong>
                </div>
                <div class="result-item">
                    <span>KDV Dahil Tutar</span>
                    <strong id="resKdvDahil">0,00 ₺</strong>
                </div>
                <div class="result-item highlight">
                    <span>Genel Toplam</span>
                    <strong id="resGenelToplam">0,00 ₺</strong>
                </div>
                <div class="result-item">
                    <span>KDV'den Matrah</span>
                    <strong id="resMatrah">0,00 ₺</strong>
                </div>
            </div>
        </main>

        <footer>
            <p>
                &copy; 2026 KDV Hesaplayıcı. Tüm hakları saklıdır.
            </p>
        </footer>
    </div>
    <script>

        document.addEventListener('DOMContentLoaded', () => {
            // Elementleri seç
            const amountInput = document.getElementById('amount');
            const calcTypeSelect = document.getElementById('calcType');
            const kdvRadios = document.getElementsByName('kdvRate');
            const customRateInput = document.getElementById('customRateInput');
            const customRateRadio = document.getElementById('customRateRadio');
            const tevkifatToggle = document.getElementById('tevkifatToggle');
            const tevkifatStatus = document.getElementById('tevkifatStatus');
            const tevkifatOptions = document.getElementById('tevkifatOptions');
            const tevkifatRateSelect = document.getElementById('tevkifatRate');

            // Sonuç elementleri
            const resKdvHaric = document.getElementById('resKdvHaric');
            const resKdvTutari = document.getElementById('resKdvTutari');
            const resTevkifatTutari = document.getElementById('resTevkifatTutari');
            const resKdvDahil = document.getElementById('resKdvDahil');
            const resGenelToplam = document.getElementById('resGenelToplam');
            const resMatrah = document.getElementById('resMatrah');
            const tevkifatResultRow = document.querySelector('.tevkifat-result');

            // Olay dinleyicileri
            [amountInput, calcTypeSelect, tevkifatToggle, tevkifatRateSelect, customRateInput].forEach(el => {
                el.addEventListener('input', calculate);
            });

            kdvRadios.forEach(radio => {
                radio.addEventListener('change', () => {
                    if (radio.value !== 'custom') {
                        customRateInput.value = '';
                    }
                    calculate();
                });
            });

            tevkifatToggle.addEventListener('change', () => {
                if (tevkifatToggle.checked) {
                    tevkifatStatus.textContent = 'Tevkifat Var';
                    tevkifatOptions.classList.remove('hidden');
                    tevkifatResultRow.classList.remove('hidden');
                } else {
                    tevkifatStatus.textContent = 'Tevkifat Yok';
                    tevkifatOptions.classList.add('hidden');
                    tevkifatResultRow.classList.add('hidden');
                }
                calculate();
            });

            // Ana hesaplama fonksiyonu
            function calculate() {
                const anaTutar = parseFloat(amountInput.value) || 0;
                const calcType = calcTypeSelect.value;
                const tevkifatAktif = tevkifatToggle.checked;
                const tevkifatOrani = parseFloat(tevkifatRateSelect.value) || 0;

                // KDV oranını belirle
                let kdvOrani = 0;
                const selectedRadio = document.querySelector('input[name="kdvRate"]:checked');
                if (selectedRadio.value === 'custom') {
                    kdvOrani = (parseFloat(customRateInput.value) || 0) / 100;
                } else {
                    kdvOrani = parseFloat(selectedRadio.value);
                }

                let kdvHaricTutar = 0;
                let kdvTutari = 0;
                let kdvDahilTutar = 0;
                let tevkifatTutari = 0;
                let genelToplam = 0;
                let kdvdenMatrah = 0;

                // Formülleri uygula
                switch (calcType) {
                    case 'kdvHaric':
                        kdvHaricTutar = anaTutar;
                        kdvTutari = anaTutar * kdvOrani;
                        tevkifatTutari = tevkifatAktif ? kdvTutari * tevkifatOrani: 0;
                        kdvDahilTutar = anaTutar + kdvTutari;
                        genelToplam = kdvDahilTutar - tevkifatTutari;
                        kdvdenMatrah = kdvOrani > 0 ? kdvTutari / kdvOrani: 0;
                        break;

                    case 'kdvDahil':
                        kdvHaricTutar = anaTutar / (1 + kdvOrani);
                        kdvTutari = anaTutar - kdvHaricTutar;
                        tevkifatTutari = tevkifatAktif ? kdvTutari * tevkifatOrani: 0;
                        kdvDahilTutar = anaTutar;
                        genelToplam = anaTutar - tevkifatTutari;
                        kdvdenMatrah = kdvOrani > 0 ? kdvTutari / kdvOrani: 0;
                        break;

                    case 'kdvTutari':
                        kdvTutari = anaTutar;
                        kdvHaricTutar = kdvOrani > 0 ? kdvTutari / kdvOrani: 0;
                        kdvDahilTutar = kdvHaricTutar + kdvTutari;
                        tevkifatTutari = tevkifatAktif ? kdvTutari * tevkifatOrani: 0;
                        genelToplam = kdvDahilTutar - tevkifatTutari;
                        kdvdenMatrah = kdvOrani > 0 ? kdvTutari / kdvOrani: 0;
                        break;

                    case 'tevkifatTutari':
                        tevkifatTutari = anaTutar;
                        if (tevkifatAktif && tevkifatOrani > 0) {
                            kdvTutari = tevkifatTutari / tevkifatOrani;
                            kdvHaricTutar = kdvOrani > 0 ? kdvTutari / kdvOrani: 0;
                            kdvDahilTutar = kdvHaricTutar + kdvTutari;
                            genelToplam = kdvDahilTutar - tevkifatTutari;
                            kdvdenMatrah = kdvOrani > 0 ? kdvTutari / kdvOrani: 0;
                        }
                        break;

                    case 'genelToplam':
                        genelToplam = anaTutar;
                        const payda = 1 - (tevkifatAktif ? (kdvOrani * tevkifatOrani) / (1 + kdvOrani): 0);
                        kdvDahilTutar = payda !== 0 ? genelToplam / payda: 0;
                        kdvHaricTutar = kdvDahilTutar / (1 + kdvOrani);
                        kdvTutari = kdvDahilTutar - kdvHaricTutar;
                        tevkifatTutari = tevkifatAktif ? kdvTutari * tevkifatOrani: 0;
                        kdvdenMatrah = kdvOrani > 0 ? kdvTutari / kdvOrani: 0;
                        break;

                    case 'kdvdenMatrah':
                        kdvdenMatrah = anaTutar;
                        kdvHaricTutar = anaTutar;
                        kdvTutari = kdvHaricTutar * kdvOrani;
                        kdvDahilTutar = kdvHaricTutar + kdvTutari;
                        tevkifatTutari = tevkifatAktif ? kdvTutari * tevkifatOrani: 0;
                        genelToplam = kdvDahilTutar - tevkifatTutari;
                        break;
                }

                updateUI({
                    kdvHaricTutar,
                    kdvTutari,
                    tevkifatTutari,
                    kdvDahilTutar,
                    genelToplam,
                    kdvdenMatrah
            });
        }

            function formatCurrency(value) {
                return new Intl.NumberFormat('tr-TR', {
                    style: 'currency',
                    currency: 'TRY',
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(value);
            }

            function updateUI(results) {
                resKdvHaric.textContent = formatCurrency(results.kdvHaricTutar);
                resKdvTutari.textContent = formatCurrency(results.kdvTutari);
                resTevkifatTutari.textContent = formatCurrency(results.tevkifatTutari);
                resKdvDahil.textContent = formatCurrency(results.kdvDahilTutar);
                resGenelToplam.textContent = formatCurrency(results.genelToplam);
                resMatrah.textContent = formatCurrency(results.kdvdenMatrah);
            }

            // İlk hesaplamayı yap
            calculate();
        });

</script>
</body>
</html>
